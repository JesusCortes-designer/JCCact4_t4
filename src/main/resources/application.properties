spring.application.name=act4

# Puerto: 8080 por defecto. En el VPS se define con la variable SERVER_PORT.
server.port=${SERVER_PORT:8080}

# Base de datos. En el VPS se definen DB_URL, DB_USER y DB_PASS como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/act4_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: la clave debe tener al menos 32 caracteres. En el VPS se define con JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-de-desarrollo-cambiala-en-el-vps-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
